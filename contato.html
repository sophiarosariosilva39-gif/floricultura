<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Jardim Encantado</title>
</head>
<body>

    <h1>Entre em contato conosco</h1>

    <p>
        Preencha o formulário abaixo para solicitar informações,
        consultar nossos produtos ou fazer um pedido.
    </p>

    <form action="#" method="get">

        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome" name="nome" required>
        <br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone">
        <br><br>

        <label for="produto">Produto de interesse:</label><br>
        <select id="produto" name="produto">
            <option value="">Selecione uma opção</option>
            <option value="buque">Buquê de rosas</option>
            <option value="girassois">Girassóis</option>
            <option value="orquidea">Orquídea</option>
            <option value="suculentas">Vaso de suculentas</option>
            <option value="cesta">Cesta de flores</option>
        </select>
        <br><br>

        <label for="data">Data desejada para atendimento:</label><br>
        <input type="date" id="data" name="data">
        <br><br>

        <label for="mensagem">Mensagem:</label><br>
        <textarea id="mensagem" name="mensagem"
                  rows="5" cols="35" required></textarea>
        <br><br>

        <input type="checkbox" id="termos" name="termos" required>
        <label for="termos">Aceito os termos de contato.</label>
        <br><br>

        <button type="submit">Enviar</button>

    </form>

    <p>
        <a href="index.html">Voltar para a página inicial</a>
    </p>

</body>
</html>
